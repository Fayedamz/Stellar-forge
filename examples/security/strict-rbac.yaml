# Strict least-privilege RBAC and PSS profile for Stellar-K8s.
#
# Assumptions:
#   operator namespace : stellar-system
#   managed namespace  : stellar
#   operator SA        : stellar-operator
#   workload SA        : stellar-node
#   operator binary    : stellar-k8s run --namespace=stellar-system --watch-namespace=stellar
#
# Apply with:
#   kubectl apply -f examples/security/strict-rbac.yaml
#
# Validate with:
#   bash examples/security/audit-rbac.sh
#
# See docs/security/rbac-hardening.md for the full permission rationale.

# ─── 1. Operator ServiceAccount ───────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-operator
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: controller
  annotations:
    # Remove or replace if not using IRSA. Never reuse this SA for ESO.
    # eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/stellar-operator
    description: "Stellar-K8s operator ServiceAccount - never share with workload pods"
automountServiceAccountToken: false  # Deployment mounts projected token explicitly

---
# ─── 2. Role: managed workload namespace (stellar) ────────────────────────────
#
# Grants minimum write access the reconciler needs inside "stellar".
# No Secret mutation. No RBAC writes. No pods/exec or pods/attach.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stellar-operator
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
rules:
  # ── Stellar CRDs ────────────────────────────────────────────────────────────
  - apiGroups: ["stellar.org"]
    resources:
      - stellarnodes
      - stellarbenchmarks
      - benchmarkreports
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources:
      - stellarnodes/status
      - stellarbenchmarks/status
      - benchmarkreports/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources:
      - stellarnodes/finalizers
      - stellarbenchmarks/finalizers
    verbs: ["update"]

  # ── Workload resources ───────────────────────────────────────────────────────
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Core resources ───────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "update", "patch"]  # forensic-snapshot only; omit if prohibited

  # ── Secrets: READ-ONLY — the operator never writes to Secrets ────────────────
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # ── Networking ───────────────────────────────────────────────────────────────
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Availability and autoscaling ─────────────────────────────────────────────
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "patch", "delete"]

  # ── External Secrets Operator ────────────────────────────────────────────────
  # Operator applies/reads ExternalSecret CRs; ESO writes target Secrets under
  # its own ServiceAccount.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch"]

  # ── CloudNativePG (optional — remove if CNPG is not used) ───────────────────
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Events (core v1 + events.k8s.io/v1 Recorder) ─────────────────────────────
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stellar-operator
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stellar-operator
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system

---
# ─── 3. Role: operator namespace (stellar-system) ─────────────────────────────
#
# Minimum needed for in-process lifecycle: preflight, feature-flag watch,
# leader election, and peer-discovery publication.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stellar-operator-self
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stellar-operator-self
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stellar-operator-self
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system

---
# ─── 4. ClusterRole: read-only cross-namespace observer ──────────────────────
#
# Required by stock binary paths that ignore --watch-namespace:
#   - preflight, PeerDiscoveryManager, snapshot worker, finalizer cleanup,
#     and QuorumOptimizer list all StellarNodes
#   - benchmark controller watches all StellarBenchmarks + owned Pods
#   - PeerDiscoveryManager looks up Services
#   - NodeDrainOrchestrator watches Nodes; infra.rs reads Node hardware labels
#
# Grants ONLY the reads forced by those paths. Does NOT grant cluster-wide
# writes, Secret reads, Node patching, or Pod eviction.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-operator-observer
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes"]
    verbs: ["list"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarbenchmarks"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-operator-observer
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-operator-observer
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system

---
# ─── 5. ClusterRole: named namespace and StorageClass access ─────────────────
#
# Namespace get: preflight reads the operator namespace; pss.rs and
# network_isolation.rs read the managed namespace; pss.rs patches PSS labels.
# resourceNames pins access so arbitrary namespaces cannot be read or modified.
#
# StorageClass get: local-storage auto-detection probes exactly two names.
# Remove the storageclasses rule if all nodes set spec.storage.storageClass.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-operator-named-resources
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["stellar-system", "stellar"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["stellar"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    resourceNames: ["local-path", "local-storage"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-operator-named-resources
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-operator-named-resources
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system

---
# ─── 6. Namespace PSS labels ─────────────────────────────────────────────────
#
# "stellar" workload namespace: enforce restricted to harden node pods.
# "stellar-system" operator namespace: audit/warn only because default Helm
# podSecurityContext does not assert seccompProfile.type: RuntimeDefault.

apiVersion: v1
kind: Namespace
metadata:
  name: stellar
  labels:
    # Pod Security Admission - enforce restricted for workload pods
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    # Network isolation labels (set stellar.org/network to match spec.network)
    stellar.org/node-namespace: "true"
    stellar.org/network: mainnet

---
apiVersion: v1
kind: Namespace
metadata:
  name: stellar-system
  labels:
    # Operator namespace: audit and warn only
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

---
# ─── 7. Validator workload ServiceAccount ────────────────────────────────────
#
# Separate SA for validator/horizon/soroban pods managed by the operator.
# Never reuse stellar-operator; bind Vault/IRSA workload roles to this SA.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-node
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-node
    app.kubernetes.io/component: workload
  annotations:
    description: "Workload SA for StellarNode pods; bind Vault/KMS roles here"
automountServiceAccountToken: false  # mount projected token only when Vault/KMS auth needs it

---
# ─── 8. Workload minimal Role ────────────────────────────────────────────────
#
# Validator, Horizon, and Soroban RPC pods need zero Kubernetes API access in
# normal operation. Empty rules make the boundary explicit and auditable.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stellar-node-workload
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-node
    app.kubernetes.io/component: rbac
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stellar-node-workload
  namespace: stellar
  labels:
    app.kubernetes.io/name: stellar-node
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stellar-node-workload
subjects:
  - kind: ServiceAccount
    name: stellar-node
    namespace: stellar
